AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Arena for Amazon Connect. Ingest from the agent event stream, single DynamoDB table, HTTP API for the agent panel, supervisor console and wallboard. Deploys into the customer's own account.

Parameters:
  ShardCount:
    Type: Number
    Default: 1
    Description: One provisioned shard handles 1 MB/s in, enough for thousands of agents' state changes.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Origin of the hosted pages, for CORS. Lock this down in production.
  JwtIssuer:
    Type: String
    Default: ''
    Description: OIDC issuer URL (Cognito user pool or the customer's IdP). Leave empty to deploy the API without auth for a pilot.
  JwtAudience:
    Type: String
    Default: ''
    Description: Client id expected in the token audience.
  EvaluationsBucket:
    Type: String
    Default: ''
    Description: Name of the existing S3 bucket Connect writes Contact Lens evaluations to. Enable "Send notifications to Amazon EventBridge" on that bucket. Leave empty to skip evaluation ingest.
  EvaluationsPrefix:
    Type: String
    Default: Evaluations/
    Description: Key prefix Connect uses for evaluation output in that bucket.
  ConnectInstanceUrl:
    Type: String
    Default: ''
    Description: Access URL of the Connect instance, e.g. https://myinstance.my.connect.aws, so the agent workspace may frame the pages. Leave empty to allow any *.my.connect.aws and *.awsapps.com instance.

Conditions:
  UseJwt: !Not [!Equals [!Ref JwtIssuer, '']]
  UseEvaluations: !Not [!Equals [!Ref EvaluationsBucket, '']]
  PinInstance: !Not [!Equals [!Ref ConnectInstanceUrl, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]               # Graviton: roughly 20% cheaper per ms
    MemorySize: 256
    Timeout: 15
    CodeUri: src/
    Environment:
      Variables:
        TABLE: !Ref Table
        TTL_DAYS: '90'

Resources:
  AgentEventStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub arena-agent-events-${AWS::StackName}
      ShardCount: !Ref ShardCount        # provisioned, not on-demand: about a third of the price at this volume
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub arena-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-ingest-${AWS::StackName}
      Handler: ingest.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - KinesisStreamReadPolicy: { StreamName: !Ref AgentEventStream }
      Events:
        Stream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt AgentEventStream.Arn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5   # a few seconds of latency buys far fewer invocations
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FunctionResponseTypes: [ReportBatchItemFailures]
            # No enhanced fan-out: shared throughput is free and plenty for one reader.

  EvaluationsFunction:
    Type: AWS::Serverless::Function
    Condition: UseEvaluations
    Properties:
      FunctionName: !Sub arena-evaluations-${AWS::StackName}
      Handler: evaluations.handler
      Environment:
        Variables:
          ACCOUNT_ID: !Ref AWS::AccountId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref EvaluationsBucket }
      Events:
        ObjectCreated:
          Type: EventBridgeRule            # works on an existing bucket; no bucket notification config to fight over
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket: { name: [!Ref EvaluationsBucket] }
                object: { key: [{ prefix: !Ref EvaluationsPrefix }] }
            RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 3600 }

  Api:
    Type: AWS::Serverless::HttpApi         # HTTP API, not REST: $1.00 per million requests instead of $3.50
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, PUT, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
      Auth: !If
        - UseJwt
        - DefaultAuthorizer: Jwt
          Authorizers:
            Jwt:
              IdentitySource: $request.header.Authorization
              JwtConfiguration:
                issuer: !Ref JwtIssuer
                audience: [!Ref JwtAudience]
        - !Ref AWS::NoValue

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-api-${AWS::StackName}
      Handler: api.handler
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          AUTH_MODE: !If [UseJwt, jwt, none]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  # ---------- Hosting: private S3 bucket behind CloudFront, API on the same origin under /api ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub arena-site-${AWS::StackName}-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub arena-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub arena-headers-${AWS::StackName}
        SecurityHeadersConfig:
          # No X-Frame-Options: the agent workspace loads the panel in an iframe. frame-ancestors does the gating.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !If
              - PinInstance
              - !Sub "frame-ancestors 'self' ${ConnectInstanceUrl}; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"
              - "frame-ancestors 'self' https://*.my.connect.aws https://*.awsapps.com; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"
          ContentTypeOptions: { Override: true }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }
          StrictTransportSecurity: { Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Arena for Amazon Connect (${AWS::StackName})
        HttpVersion: http2and3
        PriceClass: PriceClass_100          # North America and Europe edges; raise if agents sit elsewhere
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SiteHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # managed CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader: forwards Authorization, query strings
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewrite.FunctionMetadata.FunctionARN
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  ApiPathRewrite:
    # HTTP API routes are /teams/..., the distribution exposes them as /api/...; strip the prefix on the way in.
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub arena-api-rewrite-${AWS::StackName}
      AutoPublish: true
      FunctionConfig: { Comment: strip /api prefix, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.indexOf('/api/') === 0) r.uri = r.uri.substring(4);
          return r;
        }

Outputs:
  SiteUrl:
    Description: Register this as the third-party app URL in the Connect agent workspace. Supervisor console and wallboard live under it too.
    Value: !Sub https://${Distribution.DomainName}
  SiteBucket:
    Description: Upload target for the pages. Use `node lambda/deploy-pages.js <stack name>`.
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  StreamArn:
    Description: Set this as the agent event stream target in the Connect console (Data streaming).
    Value: !GetAtt AgentEventStream.Arn
  ApiUrl:
    Description: Direct API URL. The pages use /api on the site URL instead, so no CORS is involved.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
