AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Arena for Amazon Connect. Ingest from the agent event stream, single DynamoDB table, HTTP API for the agent panel, supervisor console and wallboard. Deploys into the customer's own account.

Parameters:
  ShardCount:
    Type: Number
    Default: 1
    Description: One provisioned shard handles 1 MB/s in, enough for thousands of agents' state changes.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Origin of the hosted pages, for CORS. Lock this down in production.
  AuthMode:
    Type: String
    Default: cognito
    AllowedValues: [cognito, external]
    Description: cognito creates a user pool in this stack (default). external uses JwtIssuer/JwtAudience from the customer's IdP.
  JwtIssuer:
    Type: String
    Default: ''
    Description: AuthMode=external only. OIDC issuer URL of the customer's IdP.
  JwtAudience:
    Type: String
    Default: ''
    Description: AuthMode=external only. Client id expected in the token audience.
  EvaluationsBucket:
    Type: String
    Default: ''
    Description: Name of the existing S3 bucket Connect writes Contact Lens evaluations to. Enable "Send notifications to Amazon EventBridge" on that bucket. Leave empty to skip evaluation ingest.
  EvaluationsPrefix:
    Type: String
    Default: Evaluations/
    Description: Key prefix Connect uses for evaluation output in that bucket.
  ConnectInstanceUrl:
    Type: String
    Default: ''
    Description: Access URL of the Connect instance, e.g. https://myinstance.my.connect.aws, so the agent workspace may frame the pages. Leave empty to allow any *.my.connect.aws and *.awsapps.com instance.
  MarketplaceProductCode:
    Type: String
    Default: ''
    Description: Set by the AWS Marketplace listing. When present, a nightly job reports distinct active agents (30-day window) for per-agent billing. Leave empty for pilots and direct deals.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Email address that receives operational alarms (ingest or API errors, stream falling behind, failed usage report). Leave empty to create the alarms without a subscription.

Conditions:
  UseCognito: !Equals [!Ref AuthMode, cognito]
  UseEvaluations: !Not [!Equals [!Ref EvaluationsBucket, '']]
  PinInstance: !Not [!Equals [!Ref ConnectInstanceUrl, '']]
  OnMarketplace: !Not [!Equals [!Ref MarketplaceProductCode, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]               # Graviton: roughly 20% cheaper per ms
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE: !Ref Table
        TTL_DAYS: '90'

Resources:
  AgentEventStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub arena-agent-events-${AWS::StackName}
      ShardCount: !Ref ShardCount        # provisioned, not on-demand: about a third of the price at this volume
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub arena-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-ingest-${AWS::StackName}
      CodeUri: src/            # per function: aws cloudformation package ignores Globals.CodeUri
      Handler: ingest.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - KinesisStreamReadPolicy: { StreamName: !Ref AgentEventStream }
      Events:
        Stream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt AgentEventStream.Arn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5   # a few seconds of latency buys far fewer invocations
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FunctionResponseTypes: [ReportBatchItemFailures]
            # No enhanced fan-out: shared throughput is free and plenty for one reader.

  EvaluationsFunction:
    Type: AWS::Serverless::Function
    Condition: UseEvaluations
    Properties:
      FunctionName: !Sub arena-evaluations-${AWS::StackName}
      CodeUri: src/            # per function: aws cloudformation package ignores Globals.CodeUri
      Handler: evaluations.handler
      Environment:
        Variables:
          ACCOUNT_ID: !Ref AWS::AccountId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref EvaluationsBucket }
      Events:
        ObjectCreated:
          Type: EventBridgeRule            # works on an existing bucket; no bucket notification config to fight over
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket: { name: [!Ref EvaluationsBucket] }
                object: { key: [{ prefix: !Ref EvaluationsPrefix }] }
            RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 3600 }

  MeteringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-metering-${AWS::StackName}
      CodeUri: src/            # per function: aws cloudformation package ignores Globals.CodeUri
      Handler: metering.handler
      Timeout: 60
      Environment:
        Variables:
          PRODUCT_CODE: !Ref MarketplaceProductCode
          USAGE_DIMENSION: agents
          USAGE_WINDOW_DAYS: '30'
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [aws-marketplace:MeterUsage]
              Resource: '*'
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(15 3 * * ? *)   # 03:15 UTC daily; Marketplace accepts one report per dimension per hour
            Description: Report distinct active agents to AWS Marketplace

  StreaksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-streaks-${AWS::StackName}
      CodeUri: src/            # per function: aws cloudformation package ignores Globals.CodeUri
      Handler: streaks.handler
      Timeout: 120
      Environment:
        Variables:
          STREAK_QA: '85'
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)   # 00:30 UTC: assess yesterday, pay streak bonuses into today
            Description: Assess each agent's previous day and update quality streaks

  # ---------- Operations: alarms and where they go ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub arena-alarms-${AWS::StackName}
      DisplayName: Arena alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub arena-ingest-errors-${AWS::StackName}
      AlarmDescription: The agent event ingest function is failing. Events are retried, then dropped after the stream's 24h retention.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref IngestFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  StreamLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub arena-stream-lag-${AWS::StackName}
      AlarmDescription: The ingest function is more than five minutes behind the agent event stream. Leaderboards are stale.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref IngestFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub arena-api-errors-${AWS::StackName}
      AlarmDescription: The Arena API function is throwing. Pages will show API errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub arena-api-5xx-${AWS::StackName}
      AlarmDescription: The HTTP API is returning server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref Api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  MeteringAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: OnMarketplace
    Properties:
      AlarmName: !Sub arena-metering-errors-${AWS::StackName}
      AlarmDescription: The nightly Marketplace usage report failed. Billing is behind until it succeeds.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref MeteringFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api:
    Type: AWS::Serverless::HttpApi         # HTTP API, not REST: $1.00 per million requests instead of $3.50
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, PUT, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
      Auth:
        # SAM requires this block to be literal, so the authorizer always exists; only its issuer and audience switch.
        DefaultAuthorizer: Jwt
        Authorizers:
          Jwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !If [UseCognito, !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}', !Ref JwtIssuer]
              audience:
                - !If [UseCognito, !Ref UserPoolClient, !Ref JwtAudience]

  # ---------- Identity: Cognito user pool, one user per Connect agent ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: UseCognito
    Properties:
      UserPoolName: !Sub arena-${AWS::StackName}
      UsernameConfiguration: { CaseSensitive: false }
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }   # no self sign-up; users are synced from Connect
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false }
      Schema:
        - { Name: email, AttributeDataType: String, Mutable: true, Required: false }
        - { Name: name, AttributeDataType: String, Mutable: true, Required: false }
        - { Name: agentArn, AttributeDataType: String, Mutable: true }   # the Connect agent this user is; read by the pages as custom:agentArn
        - { Name: team, AttributeDataType: String, Mutable: true }       # routing profile name, so the panel opens on the right team
      UserPoolTags: { app: arena }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: UseCognito
    Properties:
      ClientName: arena-pages
      UserPoolId: !Ref UserPool
      GenerateSecret: false                                  # public client: browser uses authorization code + PKCE
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]                  # add a SAML/OIDC provider here to federate with the customer's IdP
      # The CloudFront URLs cannot be listed here: client -> Distribution -> Api -> client is a cycle.
      # deploy-pages.js adds them after the stack exists. Localhost covers development.
      CallbackURLs:
        - http://localhost:8765/agent-panel.html
        - http://localhost:8765/supervisor-console.html
        - http://localhost:8765/wallboard.html
      LogoutURLs: [http://localhost:8765/]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: hours }   # a shift, then sign in again
      ReadAttributes: [email, name, 'custom:agentArn', 'custom:team']

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseCognito
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub arena-${AWS::StackName}-${AWS::AccountId}

  SupervisorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: UseCognito
    Properties: { UserPoolId: !Ref UserPool, GroupName: supervisors, Description: May change the scoring mix and approve rewards }

  AgentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: UseCognito
    Properties: { UserPoolId: !Ref UserPool, GroupName: agents, Description: Sees the panel and may send kudos }

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub arena-api-${AWS::StackName}
      CodeUri: src/            # per function: aws cloudformation package ignores Globals.CodeUri
      Handler: api.handler
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          AUTH_MODE: jwt
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Kiosk:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kiosk/{proxy+}
            Method: GET
            Auth:
              Authorizer: NONE   # the kiosk token in the path is the credential; the function checks it. Read-only routes only.

  # ---------- Hosting: private S3 bucket behind CloudFront, API on the same origin under /api ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub arena-site-${AWS::StackName}-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub arena-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub arena-headers-${AWS::StackName}
        SecurityHeadersConfig:
          # No X-Frame-Options: the agent workspace loads the panel in an iframe. frame-ancestors does the gating.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !If
              - PinInstance
              - !Sub "frame-ancestors 'self' ${ConnectInstanceUrl}; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com"
              - "frame-ancestors 'self' https://*.my.connect.aws https://*.awsapps.com; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com"
          ContentTypeOptions: { Override: true }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }
          StrictTransportSecurity: { Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Arena for Amazon Connect (${AWS::StackName})
        HttpVersion: http2and3
        PriceClass: PriceClass_100          # North America and Europe edges; raise if agents sit elsewhere
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SiteHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # managed CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader: forwards Authorization, query strings
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewrite.FunctionMetadata.FunctionARN
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  ApiPathRewrite:
    # HTTP API routes are /teams/..., the distribution exposes them as /api/...; strip the prefix on the way in.
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub arena-api-rewrite-${AWS::StackName}
      AutoPublish: true
      FunctionConfig: { Comment: strip /api prefix, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.indexOf('/api/') === 0) r.uri = r.uri.substring(4);
          return r;
        }

Outputs:
  SiteUrl:
    Description: Register this as the third-party app URL in the Connect agent workspace. Supervisor console and wallboard live under it too.
    Value: !Sub https://${Distribution.DomainName}
  SiteBucket:
    Description: Upload target for the pages. Use `node lambda/deploy-pages.js <stack name>`.
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  StreamArn:
    Description: Set this as the agent event stream target in the Connect console (Data streaming).
    Value: !GetAtt AgentEventStream.Arn
  ApiUrl:
    Description: Direct API URL. The pages use /api on the site URL instead, so no CORS is involved.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  AlarmTopicArn:
    Description: SNS topic every alarm publishes to. Subscribe a pager or chat integration here.
    Value: !Ref AlarmTopic
  UserPoolId:
    Condition: UseCognito
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: UseCognito
    Value: !Ref UserPoolClient
  AuthDomain:
    Condition: UseCognito
    Description: Hosted sign-in domain. deploy-pages.js writes it into config.js.
    Value: !Sub https://arena-${AWS::StackName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
