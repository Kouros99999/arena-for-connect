name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: [prototype/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          cp prototype/*.html prototype/arena-engine.js prototype/arena-auth.js site/
          echo 'window.ARENA_CONFIG = {};' > site/config.js
          cp web/* site/ && rm -f site/make-logo.py site/make-video.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
